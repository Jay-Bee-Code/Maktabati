name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: اختبارات وبناء الواجهة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # فعّل التخزين المؤقت بعد إضافة package-lock.json إلى المستودع:
          # cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build

  installers:
    name: مثبّت (${{ matrix.os }})
    # تُبنى المثبّتات عند إصدار وسم مثل v1.4.0 فقط، وبعد نجاح الاختبارات
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
        env:
          # التوقيع اختياري. بدونه تظهر تحذيرات SmartScreen (ويندوز) وGatekeeper (ماك).
          # أضف الأسرار التالية في إعدادات المستودع لتفعيله:
          #   CSC_LINK / CSC_KEY_PASSWORD  (شهادة التوقيع)
          #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID  (توثيق ماك)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
